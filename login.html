<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вхід до системи | Авіаційний портал</title>
  </head>
  <body>
    <header>
      <a href="index.html">На головну</a>
      <h1>Вхід до облікового запису</h1>
      <p>Введіть свої дані для доступу до панелі автора або читача.</p>
    </header>

    <main>
      <form action="/login" method="post">
        <div>
          <label for="login-email">Електронна пошта</label>
          <input
            type="email"
            id="login-email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div>
          <label for="login-password">Пароль</label>
          <input
            type="password"
            id="login-password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <div>
          <button type="submit">Увійти</button>
        </div>
      </form>

      <p>Ще не маєте облікового запису? <a href="register.html">Зареєструватися</a></p>
    </main>
  </body>
</html>
