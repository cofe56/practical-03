<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Реєстрація користувача | Авіаційний портал</title>
  </head>
  <body>
    <header>
      <a href="index.html">На головну</a>
      <h1>Реєстрація автора або читача</h1>
      <p>Створіть профіль для коментування та публікації матеріалів про авіацію.</p>
    </header>

    <main>
      <form action="/register" method="post">
        <div>
          <label for="reg-name">Ім'я або позивний</label>
          <input
            type="text"
            id="reg-name"
            name="displayName"
            autocomplete="name"
            minlength="2"
            maxlength="80"
            required
          >
        </div>

        <div>
          <label for="reg-email">Електронна пошта</label>
          <input
            type="email"
            id="reg-email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div>
          <label for="reg-password">Пароль</label>
          <p id="password-hint">Не менше ніж 8 символів.</p>
          <input
            type="password"
            id="reg-password"
            name="password"
            autocomplete="new-password"
            minlength="8"
            aria-describedby="password-hint"
            required
          >
        </div>

        <div>
          <label for="reg-confirm-password">Підтвердження пароля</label>
          <input
            type="password"
            id="reg-confirm-password"
            name="confirmPassword"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <div>
          <label>
            <input type="checkbox" id="reg-terms" name="terms" required>
            Я погоджуюся з правилами публікації та політикою конфіденційності
          </label>
        </div>

        <div>
          <button type="submit">Зареєструватися</button>
        </div>
      </form>

      <p>Вже зареєстровані? <a href="login.html">Увійти</a></p>
    </main>
  </body>
</html>
